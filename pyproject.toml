[project]
name = "sweepeq"
version = "0.1.0"
description = "Loudspeaker and headphone measurement and EQ: sweep measurement, inverse-filter design and a real-time Rust convolution engine."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jordi Mata Garcia" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.1", "scipy>=1.13"]

[project.optional-dependencies]
audio = ["sounddevice>=0.5"]
plot = ["matplotlib>=3.8"]

[project.scripts]
sweepeq = "sweepeq.cli:main"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["sounddevice", "scipy", "scipy.*", "matplotlib", "matplotlib.*", "sweepeq_engine"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
