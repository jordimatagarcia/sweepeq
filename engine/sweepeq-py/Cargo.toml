[package]
name = "sweepeq-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Python bindings for the sweepeq convolution engine."

[lib]
name = "sweepeq_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
sweepeq-core = { path = "../sweepeq-core" }
pyo3 = { version = "0.27", features = ["abi3-py312"] }
numpy = "0.27"
