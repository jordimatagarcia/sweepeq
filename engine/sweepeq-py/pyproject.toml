[project]
name = "sweepeq-engine"
version = "0.1.0"
description = "Python bindings for the sweepeq real-time convolution engine (Rust)."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.1"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
