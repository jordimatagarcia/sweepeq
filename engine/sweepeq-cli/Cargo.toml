[package]
name = "sweepeq-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Apply a correction filter to audio files or a live audio stream."

[[bin]]
name = "sweepeq-engine"
path = "src/main.rs"

[dependencies]
sweepeq-core = { path = "../sweepeq-core" }
hound = "3.5"
cpal = "0.16"
rtrb = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
