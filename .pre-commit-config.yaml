default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: ^docs/images/
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-identity
        name: personal git identity
        entry: tools/check_identity.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: check-history
        name: personal identity on every pushed commit
        entry: tools/check_history.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-private-words
        name: no blocked words
        entry: tools/check_private_words.sh
        language: script
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path engine/Cargo.toml --all --
        language: system
        types: [rust]
