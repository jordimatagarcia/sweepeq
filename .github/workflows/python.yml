name: python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked
      # the Rust engine's Python bindings, so tests/test_engine.py runs instead of skipping
      - run: uv pip install ./engine/sweepeq-py
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
        env:
          SWEEPEQ_REQUIRE_ENGINE: "1"
