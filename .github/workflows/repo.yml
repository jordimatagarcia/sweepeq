name: repo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    # Every commit's author and committer must be an allowed personal identity
    # (tools/allowed_identities.txt), however the commit was made.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/check_history.sh
